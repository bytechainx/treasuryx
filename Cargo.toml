[package]
name = "treasuryx"
version = "0.1.0"
edition = "2021"
rust-version = "1.71"
description = "美国财政部源事实的离线类型层：数据集常量、曲线路由与写入主权守卫、fail-closed 授权判定"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bytechainx/treasuryx"
homepage = "https://github.com/bytechainx/treasuryx"
documentation = "https://github.com/bytechainx/treasuryx#readme"
readme = "README.md"
keywords = ["treasury", "fiscal-data", "offline", "source-facts", "dataset"]
categories = ["data-structures", "finance"]
include = [
    "src/**/*",
    "tests/**/*",
    "benches/**/*",
    "examples/**/*",
    "docs/**/*",
    "README.md",
    "CHANGELOG.md",
    "CONTEXT.md",
    "CONTRIBUTING.md",
    "LICENSE-*",
    "Cargo.toml",
]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[[bench]]
name = "hot_path"
harness = false

[lints.rust]
private_interfaces = "deny"
private_bounds = "deny"
unused_must_use = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
